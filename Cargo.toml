[workspace]
resolver = "2"
members = [
    "crates/xbclient-panel",
    "crates/xbclient-ffi",
    "crates/xbclient-service",
    "apps/linux",
]
default-members = [
    "crates/xbclient-panel",
    "crates/xbclient-ffi",
    "crates/xbclient-service",
]
exclude = [
    "deps/neto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
aerion = { git = "https://github.com/MoeclubM/Aerion.git", rev = "bd67b624b7aa2202b344eaed43d4f75b38a96d42", default-features = false }
anyhow = "1.0.104"
base64 = "0.22.1"
log = "0.4.34"
once_cell = "1.21.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "gzip", "stream", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "fs", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
url = "2.5.8"
webpki-roots = "1.0.11"

[patch.crates-io]
socks5-impl = { path = "deps/neto/third_party/socks5-impl" }
tun2proxy = { path = "deps/neto/third_party/tun2proxy" }
