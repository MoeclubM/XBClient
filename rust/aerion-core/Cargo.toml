[package]
name = "aerion-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "aerion_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
aerion = { git = "https://github.com/MoeclubM/Aerion.git", rev = "a95f56562d93bcaa641358db732f89fda18a8d8b", default-features = false }
anyhow = "1.0.104"
jni = "0.22.4"
log = "0.4.34"
once_cell = "1.21.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.11"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[patch.crates-io]
socks5-impl = { path = "../third_party/socks5-impl" }
tun2proxy = { path = "../third_party/tun2proxy" }
