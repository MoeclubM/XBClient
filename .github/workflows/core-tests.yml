name: Shared core tests
on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libclang-dev
      - run: cargo test --locked --manifest-path rust/aerion-core/Cargo.toml
