name: Shared core tests
on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libclang-dev
      - run: cargo test --workspace --exclude xbclient-linux
