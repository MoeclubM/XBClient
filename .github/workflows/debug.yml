name: Beta Builds

run-name: Beta Builds · ${{ github.head_ref || github.ref_name }} · @${{ github.actor }} · #${{ github.run_number }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-beta:
    name: Android beta APK/AAB
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      XBCLIENT_DEFAULT_API_URL: ${{ secrets.XBCLIENT_DEFAULT_API_URL }}
      XBCLIENT_PANEL_TYPE: ${{ secrets.XBCLIENT_PANEL_TYPE }}
      XBCLIENT_APP_NAME: ${{ secrets.XBCLIENT_APP_NAME }}
      XBCLIENT_APPLICATION_ID: ${{ secrets.XBCLIENT_APPLICATION_ID }}
      XBCLIENT_APP_PAYMENT_ENABLED: ${{ secrets.XBCLIENT_APP_PAYMENT_ENABLED }}
      XBCLIENT_ADMOB_APP_ID: ${{ secrets.XBCLIENT_ADMOB_APP_ID }}
      XBCLIENT_APP_OPEN_AD_UNIT_ID: ${{ secrets.XBCLIENT_APP_OPEN_AD_UNIT_ID }}
      XBCLIENT_PLAN_REWARDED_AD_UNIT_ID: ${{ secrets.XBCLIENT_PLAN_REWARDED_AD_UNIT_ID }}
      XBCLIENT_POINTS_REWARDED_AD_UNIT_ID: ${{ secrets.XBCLIENT_POINTS_REWARDED_AD_UNIT_ID }}
      XBCLIENT_USER_AGENT: ${{ secrets.XBCLIENT_USER_AGENT }}
      XBCLIENT_OAUTH_CALLBACK_SCHEME: ${{ secrets.XBCLIENT_OAUTH_CALLBACK_SCHEME }}
      XBCLIENT_WEBSITE_URL: ${{ secrets.XBCLIENT_WEBSITE_URL }}
      XBCLIENT_PRIVACY_POLICY_URL: ${{ secrets.XBCLIENT_PRIVACY_POLICY_URL }}
      XBCLIENT_USER_AGREEMENT_URL: ${{ secrets.XBCLIENT_USER_AGREEMENT_URL }}
      XBCLIENT_RELEASE_STORE_BASE64: ${{ secrets.XBCLIENT_RELEASE_STORE_BASE64 }}
      XBCLIENT_RELEASE_STORE_PASSWORD: ${{ secrets.XBCLIENT_RELEASE_STORE_PASSWORD }}
      XBCLIENT_RELEASE_KEY_ALIAS: ${{ secrets.XBCLIENT_RELEASE_KEY_ALIAS }}
      XBCLIENT_RELEASE_KEY_PASSWORD: ${{ secrets.XBCLIENT_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: always

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.1.0 ndk;28.2.13676358'

      - name: Validate app build secrets
        shell: bash
        run: |
          panel_type="$(printf '%s' "${XBCLIENT_PANEL_TYPE:-xboard}" | tr '[:upper:]' '[:lower:]')"
          for name in XBCLIENT_DEFAULT_API_URL XBCLIENT_APP_NAME XBCLIENT_APPLICATION_ID XBCLIENT_USER_AGENT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or not available to this workflow"
              exit 1
            fi
          done
          if [ "$panel_type" != "pxboard" ] && [ -z "${XBCLIENT_OAUTH_CALLBACK_SCHEME:-}" ]; then
            echo "::error::XBCLIENT_OAUTH_CALLBACK_SCHEME is empty or not available to this workflow"
            exit 1
          fi
          if { [ -n "${XBCLIENT_APP_OPEN_AD_UNIT_ID:-}" ] || [ -n "${XBCLIENT_PLAN_REWARDED_AD_UNIT_ID:-}" ] || [ -n "${XBCLIENT_POINTS_REWARDED_AD_UNIT_ID:-}" ]; } && [ -z "${XBCLIENT_ADMOB_APP_ID:-}" ]; then
            echo "::error::XBCLIENT_ADMOB_APP_ID is required when any AdMob ad unit ID is configured"
            exit 1
          fi

      - name: Prepare release keystore
        shell: bash
        run: |
          for name in XBCLIENT_RELEASE_STORE_BASE64 XBCLIENT_RELEASE_STORE_PASSWORD XBCLIENT_RELEASE_KEY_ALIAS XBCLIENT_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or not available to this workflow"
              exit 1
            fi
          done
          XBCLIENT_RELEASE_STORE_FILE="$RUNNER_TEMP/xbclient-release-signing.jks"
          echo "XBCLIENT_RELEASE_STORE_FILE=$XBCLIENT_RELEASE_STORE_FILE" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$XBCLIENT_RELEASE_STORE_FILE")"
          printf '%s' "$XBCLIENT_RELEASE_STORE_BASE64" | base64 -d > "$XBCLIENT_RELEASE_STORE_FILE"

      - name: Verify shared release signing certificate
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$XBCLIENT_RELEASE_STORE_FILE" \
            -storepass "$XBCLIENT_RELEASE_STORE_PASSWORD" \
            -alias "$XBCLIENT_RELEASE_KEY_ALIAS" \
            | grep -E 'Alias name:|SHA256:'

      - name: Set up Rust Android targets
        shell: bash
        run: rustup target add aarch64-linux-android

      - name: Build signed beta APK and AAB
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :apps:android:assembleGithubRelease :apps:android:bundlePlayRelease --build-cache --stacktrace
          apk="$(find apps/android/build/outputs/apk -type f -name '*-arm64-v8a-release.apk' -print -quit)"
          bundle="$(find apps/android/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$bundle"
          mkdir -p apps/android/build/outputs/dist
          mv "$apk" "apps/android/build/outputs/dist/${XBCLIENT_APP_NAME}-arm64-v8a-beta-${GITHUB_RUN_ID}.apk"
          mv "$bundle" "apps/android/build/outputs/dist/${XBCLIENT_APP_NAME}-beta-${GITHUB_RUN_ID}.aab"

      - name: Upload beta Android AAB
        uses: actions/upload-artifact@v7
        with:
          name: xbclient-beta-android-aab-${{ github.run_id }}
          archive: false
          path: apps/android/build/outputs/dist/${{ env.XBCLIENT_APP_NAME }}-beta-${{ github.run_id }}.aab
          if-no-files-found: error

      - name: Upload beta Android APK
        uses: actions/upload-artifact@v7
        with:
          name: xbclient-beta-android-${{ github.run_id }}
          archive: false
          path: apps/android/build/outputs/dist/${{ env.XBCLIENT_APP_NAME }}-arm64-v8a-beta-${{ github.run_id }}.apk
          if-no-files-found: error

  windows-beta:
    name: Windows WinUI 3 native beta (x64)
    runs-on: windows-2022
    env:
      CARGO_TERM_COLOR: always
      XBCLIENT_DEFAULT_API_URL: ${{ secrets.XBCLIENT_DEFAULT_API_URL }}
      XBCLIENT_PANEL_TYPE: ${{ secrets.XBCLIENT_PANEL_TYPE }}
      XBCLIENT_APP_NAME: ${{ secrets.XBCLIENT_APP_NAME }}
      XBCLIENT_APP_PAYMENT_ENABLED: ${{ secrets.XBCLIENT_APP_PAYMENT_ENABLED }}
      XBCLIENT_USER_AGENT: ${{ secrets.XBCLIENT_USER_AGENT }}
      XBCLIENT_OAUTH_CALLBACK_SCHEME: ${{ secrets.XBCLIENT_OAUTH_CALLBACK_SCHEME }}
      XBCLIENT_WEBSITE_URL: ${{ secrets.XBCLIENT_WEBSITE_URL }}
      XBCLIENT_PRIVACY_POLICY_URL: ${{ secrets.XBCLIENT_PRIVACY_POLICY_URL }}
      XBCLIENT_USER_AGREEMENT_URL: ${{ secrets.XBCLIENT_USER_AGREEMENT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Validate desktop build secrets
        shell: bash
        run: bash scripts/ci/validate-desktop-secrets.sh

      - name: Install NASM
        shell: bash
        run: |
          choco install nasm --no-progress --yes
          echo 'C:/Program Files/NASM' >> "$GITHUB_PATH"

      - name: Build xbclient_ffi & WinUI 3 app
        shell: bash
        run: |
          latest_tag="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.17)"
          base_ver="${latest_tag#v}"
          cargo build --release -p xbclient-ffi -p xbclient-service
          mkdir -p apps/windows/native dist
          cp target/release/xbclient_ffi.dll apps/windows/native/
          cp target/release/wintun.dll apps/windows/native/
          cp target/release/neto-service.exe apps/windows/native/
          dotnet publish apps/windows/XBClient.Windows.csproj \
            -c Release \
            -r win-x64 \
            -p:Version="$base_ver" \
            -p:InformationalVersion="${base_ver}-beta.${GITHUB_RUN_ID}" \
            -o dist/XBClient
          test -f dist/XBClient/XBClient.exe
          test -f dist/XBClient/XBClient.pri
          test -f dist/XBClient/xbclient_ffi.dll
          test -f dist/XBClient/wintun.dll
          test -f dist/XBClient/neto-service.exe
          export ZIP_PATH="dist/${XBCLIENT_APP_NAME}-win-x64-beta-${GITHUB_RUN_ID}.zip"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/XBClient' -DestinationPath \$env:ZIP_PATH -Force"

      - name: Build beta Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $latestTag = (git describe --tags --abbrev=0 2>$null); if (-not $latestTag) { $latestTag = "v0.0.17" }
          $baseVer = $latestTag.TrimStart('v')
          $appName = $env:XBCLIENT_APP_NAME
          $outBase = "$appName-win-x64-beta-setup-$($env:GITHUB_RUN_ID)"
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
          }
          & $iscc "/DMyAppName=$appName" "/DMyAppVersion=$baseVer-beta.$($env:GITHUB_RUN_ID)" "/DOutputBaseFilename=$outBase" 'apps/windows/installer/XBClient.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "dist/$outBase.exe")) { throw "dist/$outBase.exe missing" }

      - name: Upload beta Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: xbclient-beta-windows-setup-${{ github.run_id }}
          archive: false
          path: dist/${{ env.XBCLIENT_APP_NAME }}-win-x64-beta-setup-${{ github.run_id }}.exe
          if-no-files-found: error

      - name: Upload beta Windows package
        uses: actions/upload-artifact@v7
        with:
          name: xbclient-beta-windows-${{ github.run_id }}
          archive: false
          path: dist/${{ env.XBCLIENT_APP_NAME }}-win-x64-beta-${{ github.run_id }}.zip
          if-no-files-found: error

  linux-beta:
    name: Linux Wayland GTK4 beta deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      CARGO_TERM_COLOR: always
      XBCLIENT_DEFAULT_API_URL: ${{ secrets.XBCLIENT_DEFAULT_API_URL }}
      XBCLIENT_PANEL_TYPE: ${{ secrets.XBCLIENT_PANEL_TYPE }}
      XBCLIENT_APP_NAME: ${{ secrets.XBCLIENT_APP_NAME }}
      XBCLIENT_APP_PAYMENT_ENABLED: ${{ secrets.XBCLIENT_APP_PAYMENT_ENABLED }}
      XBCLIENT_USER_AGENT: ${{ secrets.XBCLIENT_USER_AGENT }}
      XBCLIENT_OAUTH_CALLBACK_SCHEME: ${{ secrets.XBCLIENT_OAUTH_CALLBACK_SCHEME }}
      XBCLIENT_WEBSITE_URL: ${{ secrets.XBCLIENT_WEBSITE_URL }}
      XBCLIENT_PRIVACY_POLICY_URL: ${{ secrets.XBCLIENT_PRIVACY_POLICY_URL }}
      XBCLIENT_USER_AGREEMENT_URL: ${{ secrets.XBCLIENT_USER_AGREEMENT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate desktop build secrets
        shell: bash
        run: bash scripts/ci/validate-desktop-secrets.sh

      - name: Install GTK4 / libadwaita dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libclang-dev libgtk-4-dev libadwaita-1-dev dpkg-dev

      - name: Build & package Linux Wayland deb
        shell: bash
        run: |
          cargo build --release -p xbclient-linux
          pkg_root="dist/pkg-xbclient_${{ matrix.arch }}"
          mkdir -p "$pkg_root/DEBIAN" "$pkg_root/usr/bin" "$pkg_root/usr/share/applications" dist
          cp target/release/xbclient "$pkg_root/usr/bin/xbclient"
          chmod 0755 "$pkg_root/usr/bin/xbclient"
          sed "s/^Name=.*/Name=${XBCLIENT_APP_NAME}/" apps/linux/data/xbclient.desktop > "$pkg_root/usr/share/applications/xbclient.desktop"
          printf '%s\n' \
            "Package: xbclient" \
            "Version: 0.1.0" \
            "Section: net" \
            "Priority: optional" \
            "Architecture: ${{ matrix.arch }}" \
            "Depends: libc6, libgtk-4-1, libadwaita-1-0" \
            "Maintainer: MoeclubM" \
            "Description: ${XBCLIENT_APP_NAME} native client for Linux Wayland" \
            > "$pkg_root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$pkg_root" "dist/${XBCLIENT_APP_NAME}-linux-${{ matrix.arch }}-beta-${GITHUB_RUN_ID}.deb"

      - name: Upload beta Linux deb
        uses: actions/upload-artifact@v7
        with:
          name: xbclient-beta-linux-${{ matrix.arch }}-${{ github.run_id }}
          archive: false
          path: dist/${{ env.XBCLIENT_APP_NAME }}-linux-${{ matrix.arch }}-beta-${{ github.run_id }}.deb
          if-no-files-found: error
